# Netlify-Einstellungen für BranndNew (statische Seite, kein Build nötig)
[build]
  publish = "."

# Interne Dateien nicht öffentlich ausliefern (enthält u. a. eure E-Mail-Adressen)
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# Sicherheits-Header für alle Seiten
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://qjrljfmoifkboucciabm.supabase.co wss://qjrljfmoifkboucciabm.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Dashboard nie in Suchmaschinen und nie zwischenspeichern
[[headers]]
  for = "/dashboard.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Konfig immer frisch laden, damit Änderungen sofort greifen
[[headers]]
  for = "/supabase-config.js"
  [headers.values]
    Cache-Control = "no-cache"
